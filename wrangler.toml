name = "motorcore-parts"
main = "_worker.js"
compatibility_date = "2024-09-23"

# Points Cloudflare directly to static assets in the root folder
[site]
bucket = "."

# Binds your live D1 Database
[[d1_databases]]
binding = "DB"
database_name = "motorcore-parts-db"
database_id = "YOUR_D1_DATABASE_ID"
