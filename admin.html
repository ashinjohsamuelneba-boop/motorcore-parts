<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotorCore Admin — Inventory &amp; Quotes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">MotorCore <span>Admin Portal</span></a>
      <a href="index.html" class="btn secondary">View Storefront</a>
    </div>
  </header>

  <main class="container main-content" style="padding-top: 30px; padding-bottom: 60px;">
    
    <section class="form-card" style="margin-bottom: 40px;">
      <h2>Admin Security Verification</h2>
      <div class="field">
        <label for="adminKey">Admin Passcode / API Key</label>
        <input type="password" id="adminKey" value="motorcore-admin-2026" placeholder="Enter Admin Key">
      </div>
    </section>

    <section class="form-card">
      <h2>Add New Stock Item</h2>
      <form id="addPartForm">
        <div class="two">
          <div class="field">
            <label for="pTitle">Part Title</label>
            <input type="text" id="pTitle" placeholder="e.g. OEM FoMoCo Alternator" required>
          </div>
          <div class="field">
            <label for="pStockId">Stock ID</label>
            <input type="text" id="pStockId" placeholder="e.g. MC-8921-A" required>
          </div>
        </div>

        <div class="two">
          <div class="field">
            <label for="pOem">OEM Part Number</label>
            <input type="text" id="pOem" placeholder="e.g. JL3Z-10346-A">
          </div>
          <div class="field">
            <label for="pPrice">Price ($USD)</label>
            <input type="number" step="0.01" id="pPrice" placeholder="185.00" required>
          </div>
        </div>

        <div class="two">
          <div class="field">
            <label for="pMake">Vehicle Make</label>
            <input type="text" id="pMake" placeholder="e.g. Ford" required>
          </div>
          <div class="field">
            <label for="pModel">Vehicle Model</label>
            <input type="text" id="pModel" placeholder="e.g. F-150" required>
          </div>
        </div>

        <div class="two">
          <div class="field">
            <label for="pYearStart">Start Year</label>
            <input type="number" id="pYearStart" placeholder="2018" required>
          </div>
          <div class="field">
            <label for="pYearEnd">End Year</label>
            <input type="number" id="pYearEnd" placeholder="2021" required>
          </div>
        </div>

        <div class="field">
          <label for="pDonor">Donor Vehicle Info</label>
          <input type="text" id="pDonor" placeholder="e.g. 2019 Ford F-150 Lariat (42,100 Miles)">
        </div>

        <button type="submit" class="btn primary btn-block">Publish to D1 Database</button>
      </form>
    </section>

  </main>

  <script>
    document.getElementById('addPartForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const secret = document.getElementById('adminKey').value;
      const data = {
        title: document.getElementById('pTitle').value,
        stock_id: document.getElementById('pStockId').value,
        oem_number: document.getElementById('pOem').value,
        price: parseFloat(document.getElementById('pPrice').value),
        make: document.getElementById('pMake').value,
        model: document.getElementById('pModel').value,
        year_start: parseInt(document.getElementById('pYearStart').value),
        year_end: parseInt(document.getElementById('pYearEnd').value),
        donor_info: document.getElementById('pDonor').value,
        condition: 'Grade A Tested'
      };

      try {
        const res = await fetch('/api/admin/parts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Secret': secret
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert('Part successfully added to database!');
          e.target.reset();
        } else {
          alert('Unauthorized or database error. Check secret key.');
        }
      } catch (err) {
        alert('Network error communicating with API.');
      }
    });
  </script>
</body>
</html>
