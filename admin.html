<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — MotorCore Parts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">MotorCore <span>Admin</span></a>
      <a href="index.html" class="btn secondary">Back to Store</a>
    </div>
  </header>

  <main class="container" style="padding: 40px 20px;">
    <!-- Login Card -->
    <div id="loginSection" class="form-card" style="max-width: 400px; margin: 40px auto;">
      <h2>Admin Login</h2>
      <p style="color: var(--muted); margin-bottom: 20px;">Enter credentials to access inventory management.</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="adminUser" placeholder="Username (admin)" required>
        <input type="password" id="adminPass" placeholder="Password (admin123)" required>
        <button class="btn primary" onclick="login()">Log In</button>
      </div>
    </div>

    <!-- Admin Panel Content -->
    <div id="adminPanel" style="display: none;">
      <h2>Add New Inventory Item</h2>
      <form id="addPartForm" class="form-card" style="margin-bottom: 40px;">
        <div class="two">
          <input type="text" id="partName" placeholder="Part Name (e.g. Starter Motor)" required>
          <input type="text" id="partSku" placeholder="SKU (e.g. STR-FORD-013)" required>
        </div>
        <div class="two">
          <input type="text" id="partCategory" placeholder="Category (e.g. Ignition, Brakes)" required>
          <input type="number" step="0.01" id="partPrice" placeholder="Price ($)" required>
        </div>
        <div class="two">
          <input type="number" id="partStock" placeholder="Stock Quantity" required>
          <input type="text" id="partMake" placeholder="Make (e.g. Ford, Toyota, Chevy)">
        </div>
        <textarea id="partDesc" placeholder="Description" rows="3"></textarea>
        <button type="submit" class="btn primary">Save Part to D1 Database</button>
      </form>
    </div>
  </main>

  <script>
    function login() {
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;
      if (user === 'admin' && pass === 'admin123') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
      } else {
        alert('Invalid login credentials.');
      }
    }

    document.getElementById('addPartForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      alert('Part saved successfully!');
      e.target.reset();
    });
  </script>
</body>
</html>
